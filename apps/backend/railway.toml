# Railway config-as-code for the Strapi backend service.
#
# Config as Code is deprecated in favour of Infrastructure as Code
# (`.railway/railway.ts`); existing files stop being read on 2026-12-01.
# See https://docs.railway.com/infrastructure-as-code
# :schema https://railway.com/railway.schema.json

[build]
# Railpack is Railway's default builder. The hardened Dockerfile in this
# directory is used for self-hosting (podman/compose) and CI image scans.
builder = "RAILPACK"
buildCommand = "pnpm run build"
# Monorepo: only redeploy when the backend or the workspace manifests change.
# Patterns are matched from the repository root, even with a root directory set.
watchPatterns = [
  "/apps/backend/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
]

[deploy]
startCommand = "pnpm run start"
# Strapi v5 answers GET /_health with 204, which Railway treats as healthy.
healthcheckPath = "/_health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Zero-downtime deploys: keep the old deploy serving while the new one boots,
# then give the old one a grace period after SIGTERM before SIGKILL.
overlapSeconds = 30
drainingSeconds = 30
