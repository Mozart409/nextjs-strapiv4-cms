name: E2E

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi
        ports:
          - 5555:5432
        options: >-
          --health-cmd "pg_isready -U strapi -d strapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Development config: local uploads instead of S3.
      NODE_ENV: development
      DATABASE_HOST: localhost
      DATABASE_PORT: 5555
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      # Throwaway secrets for the CI instance only.
      APP_KEYS: e2eKeyOne,e2eKeyTwo
      API_TOKEN_SALT: e2e-api-token-salt
      ADMIN_JWT_SECRET: e2e-admin-jwt-secret
      TRANSFER_TOKEN_SALT: e2e-transfer-token-salt
      JWT_SECRET: e2e-jwt-secret

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Build admin panel
        run: pnpm be

      - name: Seed database
        run: pnpm seed

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
